name: UX-1.1 Navigation Interaction Tests
on:
  push:
    branches: [codex/ux-1-1-navigation-rebuild]
  pull_request:
    paths:
      - 'src/siteData.js'
      - 'src/v4/components/Nav/**'
      - 'src/v4/components/MarketingHeader.tsx'
      - 'e2e/nav.spec.ts'
      - 'playwright.config.ts'
permissions:
  contents: read
concurrency:
  group: ux-1-1-nav-tests
  cancel-in-progress: true
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test desktop hover, keyboard, and mobile accordion
        run: npx playwright test e2e/nav.spec.ts --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-1-1-nav-test-results
          path: test-results/
          retention-days: 14
