name: Phase 4 layout evidence
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/capture-disclaimer-layout.mjs'
      - '.github/workflows/phase-4-layout.yml'
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: candidate
      - uses: actions/checkout@v7.0.1
        with:
          ref: 53ecce727c3ec036af941c0f9990ed7d81d66678
          path: before
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: candidate
      - name: Capture all affected frames at three widths
        run: |
          ln -s "$GITHUB_WORKSPACE/candidate/node_modules" before/node_modules
          (cd before && npx vite --host 127.0.0.1 --port 4325 > /tmp/before.log 2>&1) &
          (cd candidate && npx vite --host 127.0.0.1 --port 4326 > /tmp/after.log 2>&1) &
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT
          for port in 4325 4326; do
            for attempt in $(seq 1 30); do
              curl -fsS "http://127.0.0.1:$port/" > /dev/null && break
              sleep 1
            done
          done
          cd candidate
          node scripts/capture-disclaimer-layout.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-4-before-after
          path: candidate/test-results/phase-4-layout/
          retention-days: 30
