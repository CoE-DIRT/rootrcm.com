name: UX-1.1 Navigation Screenshots
on:
  push:
    branches: [codex/ux-1-1-navigation-rebuild]
    paths:
      - 'src/**'
      - 'playwright.config.ts'
      - 'scripts/ux-audit/ux11-screens.mjs'
      - 'scripts/ux-audit/ux11-diff.py'
      - '.github/workflows/ux-1-1-screenshots.yml'
permissions:
  contents: write
concurrency:
  group: ux-1-1-nav-screens
  cancel-in-progress: true
jobs:
  screenshot-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Capture matching before and after viewports
        run: |
          npx vite --host 127.0.0.1 --port 4319 --strictPort > /tmp/ux11-vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4319/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/ux-audit/ux11-screens.mjs
          python3 -m pip install --quiet --break-system-packages pillow
          python3 scripts/ux-audit/ux11-diff.py
      - uses: actions/upload-artifact@v4
        with:
          name: ux-1-1-nav-before-after
          path: docs/website/ux-1-1/screens/
          retention-days: 30
      - name: Commit screenshot differences for PR review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/website/ux-1-1/screens/
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "docs(ux-1.1): attach navigation screenshot diffs [skip ci]"
            git push origin HEAD:codex/ux-1-1-navigation-rebuild
          fi
